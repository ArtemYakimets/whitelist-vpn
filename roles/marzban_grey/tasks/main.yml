---
# Deploy Grey VPN (GreyVPN) — direct Marzban + Xray VLESS Reality XHTTP on ForeignVM

- name: Create Grey Marzban directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/marzban-grey
    - /var/lib/marzban-grey

- name: Check if Grey admin password already stored
  stat:
    path: /var/lib/marzban-grey/.admin_password
  register: grey_pass_file

- name: Generate Grey admin password
  shell: openssl rand -base64 24
  register: grey_pass_gen
  when: not grey_pass_file.stat.exists
  no_log: true

- name: Store Grey admin password
  copy:
    content: "{{ grey_pass_gen.stdout }}"
    dest: /var/lib/marzban-grey/.admin_password
    mode: '0600'
  when: not grey_pass_file.stat.exists
  no_log: true

- name: Read Grey admin password
  slurp:
    src: /var/lib/marzban-grey/.admin_password
  register: stored_grey_pass
  no_log: true

- name: Set Grey admin password fact
  set_fact:
    grey_admin_password: "{{ stored_grey_pass.content | b64decode | trim }}"
    cacheable: yes
  no_log: true

# Reuse Reality keys generated by xray/install role
- name: Read Reality private key for Grey VPN
  slurp:
    src: /etc/xray/reality_private_key
  register: grey_privkey_file
  no_log: true

- name: Read Reality public key for Grey VPN
  slurp:
    src: /etc/xray/reality_public_key
  register: grey_pubkey_file

- name: Read Reality short ID for Grey VPN
  slurp:
    src: /etc/xray/short_id
  register: grey_shortid_file

- name: Template Grey Xray config (VLESS Reality XHTTP)
  template:
    src: xray_config.json.j2
    dest: /var/lib/marzban-grey/xray_config.json
    mode: '0644'
  vars:
    grey_private_key: "{{ grey_privkey_file.content | b64decode | trim }}"
    grey_public_key: "{{ grey_pubkey_file.content | b64decode | trim }}"
    grey_short_id: "{{ grey_shortid_file.content | b64decode | trim }}"

- name: Template Grey Marzban environment file
  template:
    src: env.j2
    dest: /opt/marzban-grey/.env
    mode: '0600'
  no_log: true

- name: Template Grey Marzban docker-compose
  template:
    src: docker-compose.yml.j2
    dest: /opt/marzban-grey/docker-compose.yml
    mode: '0644'

- name: Pull Marzban image (if not cached)
  command: docker pull gozargah/marzban:latest
  changed_when: false

- name: Start Grey Marzban
  command: docker compose up -d
  args:
    chdir: /opt/marzban-grey
  register: grey_marzban_start

- name: Allow Grey VPN port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ grey_xray_port | string }}"
    proto: tcp

- name: Wait for Grey Marzban to be ready
  uri:
    url: "http://127.0.0.1:{{ grey_marzban_port }}/api/"
    status_code: [200, 404, 422]
  register: grey_health
  until: grey_health.status is defined
  retries: 60
  delay: 5
  failed_when: false

- name: Display Grey Marzban credentials
  debug:
    msg: |
      === Grey VPN (GreyVPN) Credentials ===
      URL:      https://{{ foreignvm_domain }}{{ grey_dashboard_path }}
      Username: admin
      Password: {{ grey_admin_password }}
      VPN Port: {{ grey_xray_port }}
